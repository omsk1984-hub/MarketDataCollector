version: '3.8'

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-MarketDataDb}
  POSTGRES_USER: ${POSTGRES_USER:-marketdata_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword123!}

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketdata-postgres
    environment:
      <<: *postgres-env
      # trust только для локальной разработки на Windows (Npgsql через Docker NAT
      # не выполняет корректно SCRAM-SHA-256). В production (docker-compose.prod.yml)
      # используется полноценная аутентификация по паролю из .env.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Схема создаётся EF Core миграциями (Database.Migrate() в Program.cs),
      # а не init.sql — иначе конфликт с партиционированной таблицей rawticks.
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketdata_user -d MarketDataDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    # Фиксированная версия 3.9.0 — stable KRaft без heartbeat таймаутов,
    # которые наблюдались на apache/kafka:latest (4.2.0)
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode — без ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: marketdata-kafka-cluster
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Увеличенные таймауты для стабильности KRaft heartbeat
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 500
      KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS: 60000
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 90000
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init-topics:
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
          echo "  Kafka not ready yet, sleeping..."
          sleep 3
        done
        echo "Kafka is ready. Creating topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic raw-ticks --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aggregated-data --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic connection-events --partitions 1 --replication-factor 1
        echo "Topics created successfully:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - marketdata-network
    depends_on:
      kafka:
        condition: service_healthy

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: marketdata-kafdrop
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms64m -Xmx128m
      - SERVER_SERVLET_CONTEXTPATH=/
    networks:
      - marketdata-network
    depends_on:
      - kafka
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: marketdata-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    # Токен для /metrics воркера из docker secret (prometheus.yml ссылается на
    # /run/secrets/auth_api_key). В dev worker НЕ задаёт Auth__ApiKey, поэтому
    # middleware неактивен и токен игнорируется, но файл секрета должен
    # существовать, иначе Prometheus не загрузит конфиг.
    secrets:
      - auth_api_key
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - marketdata-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: marketdata-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - marketdata-network
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: marketdata-blackbox
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - marketdata-network
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.1
    container_name: marketdata-aspire-dashboard
    ports:
      - "18889:18889"  # OTLP gRPC
      - "19000:18888"  # Dashboard Web UI (18888 внутренний → 19000 внешний)
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      - marketdata-network
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: marketdata-worker:latest
    container_name: marketdata-worker
    environment:
      # .NET Configuration env-провайдер (double-underscore = вложенность):
      # ConnectionStrings__MarketDataDb, Kafka__BootstrapServers, OpenTelemetry__OtlpEndpoint и т.д.
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5010
      ConnectionStrings__MarketDataDb: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-MarketDataDb};
        Username=${POSTGRES_USER:-marketdata_user};
        Password=${POSTGRES_PASSWORD:-StrongPassword123!};
        sslmode=Disable;Keepalive=30;Include Error Detail=true;CommandTimeout=120
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      ExchangeOptions__Exchanges__0__WebSocketUrl: ${EXCHANGE_WEBSOCKET_URL:-wss://stream.binance.com:9443/ws/{symbol}@trade}
      Logging__LogLevel__Default: Information
    ports:
      - "5010:5010"  # /health и /metrics
    networks:
      - marketdata-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:

secrets:
  # Docker secret для Bearer/API-key доступа к /metrics воркера.
  # Значение берётся из AUTH_API_KEY (задаётся в docker/.env, см. .env.example).
  # В dev worker не проверяет токен, но переменная обязана существовать.
  auth_api_key:
    environment: AUTH_API_KEY

networks:
  marketdata-network:
    driver: bridge
