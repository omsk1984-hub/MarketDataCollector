# Production compose.
# Использование:
#   export DOCKER_ENV_FILE=docker/.env   # docker compose автоматически читает .env
#   docker compose -f docker/docker-compose.prod.yml pull
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Секреты задаются ТОЛЬКО через docker/.env (см. .env.example). В этом файле нет
# хардкода паролей, POSTGRES_HOST_AUTH_METHOD: trust отключён — используется
# полноценная SCRAM-аутентификация.

# ===== Общие env-переменные 3-нодного KRaft-кластера Kafka (RF >= 3) =====
# Каждая нода — combined broker+controller. QUORUM из 3 контроллеров
# обеспечивает отказоустойчивость: кластер работает при падении одной ноды.
# Анкор вынесен на верхний уровень (x-extension), т.к. docker-compose не допускает
# объявление такого блока внутри services: — он трактовался бы как сервис.
x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # RF=3 для внутренних топиков (offsets, transaction state)
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_CLUSTER_ID: marketdata-kafka-cluster

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketdata-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ВАЖНО: Схема БД создаётся EF Core миграциями (Database.Migrate() в Program.cs),
      # а не init.sql. Поэтому init.sql НЕ монтируется в production.
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-1:
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka-1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka-2
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka-3
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    networks:
      - marketdata-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init-topics:
    image: apache/kafka:3.9.0
    container_name: marketdata-kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka cluster to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list > /dev/null 2>&1; do
          echo "  Kafka not ready yet, sleeping..."
          sleep 3
        done
        echo "Kafka is ready. Creating topics with RF=3..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic raw-ticks --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic aggregated-data --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic connection-events --partitions 1 --replication-factor 3
        echo "Topics created successfully:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list
    networks:
      - marketdata-network
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: marketdata-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    # Токен для /metrics воркера берём из docker secret (создаётся автоматически,
    # без shell в контейнере). Prometheus читает authorization.credentials_file.
    secrets:
      - auth_api_key
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - marketdata-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: marketdata-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - marketdata-network
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: marketdata-blackbox
    environment:
      AUTH_API_KEY: ${AUTH_API_KEY:?AUTH_API_KEY required in .env}
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - marketdata-network
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.1
    container_name: marketdata-aspire-dashboard
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      - marketdata-network
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER:-marketdata-collector}/marketdata-worker:latest
    container_name: marketdata-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5010
      ConnectionStrings__MarketDataDb: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD};
        sslmode=Disable;Keepalive=30;Include Error Detail=true;CommandTimeout=120
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      ExchangeOptions__Exchanges__0__WebSocketUrl: ${EXCHANGE_WEBSOCKET_URL:-wss://stream.binance.com:9443/ws/{symbol}@trade}
      Auth__ApiKey: ${AUTH_API_KEY:?AUTH_API_KEY required in .env}
    ports:
      - "5010:5010"  # /health и /metrics
    networks:
      - marketdata-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${AUTH_API_KEY:?AUTH_API_KEY required in .env}", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  prometheus_data:

secrets:
  # Docker secret для Bearer/API-key доступа к /metrics и /health воркера.
  # Значение берётся из AUTH_API_KEY в docker/.env.
  auth_api_key:
    environment: AUTH_API_KEY

networks:
  marketdata-network:
    driver: bridge
